<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0e24" />
    <meta
      name="description"
      content="Suraj Randave - Full-stack developer specialising in Laravel, React.js, TypeScript and PostgreSQL."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Suraj Randave — Full-Stack Developer</title>
    <script>
      /*
       * Runs before first paint so the page never flashes the wrong theme.
       * Stamps an explicit data-theme, which is the single source of truth the
       * useTheme hook reads back on mount.
       */
      ;(function () {
        var theme
        try {
          theme = localStorage.getItem('portfolio-theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
